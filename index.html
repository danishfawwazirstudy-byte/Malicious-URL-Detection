<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Threat Detector</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* ====== Palet warna: ganti di sini saja ====== */
        :root {
            --bg: #12081f;            /* background halaman */
            --navbar: #1a0d2e;        /* navbar */
            --card: #1f1233;          /* kotak di tengah */
            --input-bg: #2a1a45;      /* background input */
            --accent: #a855f7;        /* judul & border input */
            --button: #7c3aed;        /* tombol */
            --button-hover: #6d28d9;  /* tombol saat di-hover */
            --text: #f3e8ff;          /* teks utama */
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            background: var(--navbar);
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar h1 {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            margin-top: 120px;
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            width: 70%;
            max-width: 800px;
            text-align: center;
        }

        input {
            width: 95%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid var(--accent);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text);
            margin-bottom: 15px;
        }

        button {
            background-color: var(--button);
            color: white;
            padding: 14px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
        }

        button:hover {
            background-color: var(--button-hover);
            transform: scale(1.05);
        }

        .scan-icon {
            font-size: 20px;
        }

        /* Spinner */
        .spinner {
            display: none;
            margin: 10px auto;
            border: 5px solid var(--input-bg);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result Styling */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-size: 18px;
        }

        .benign { color: #34D399; }
        .defacement { color: #F59E0B; }
        .malware { color: #EF4444; }
        .phishing { color: #F472B6; }  /* diganti dari ungu supaya beda dengan tema */
        .unknown { color: #ffffff; }
    </style>

    <script>
        function showSpinner(formId, spinnerId) {
            document.getElementById(spinnerId).style.display = 'block';
            setTimeout(() => {
                document.getElementById(spinnerId).style.display = 'none';
            }, 3000);  // Simulating loading time
        }
    </script>
</head>
<body>

    <div class="navbar">
        <h1><i class="fas fa-shield-alt"></i> ThreatGuard</h1>
    </div>

    <div class="container">
        <h2><i class="fas fa-exclamation-triangle"></i> Malicious Files</h2>
        <form action="/scam/" method="post" enctype="multipart/form-data" onsubmit="showSpinner('fileForm', 'fileSpinner')">
            <label for="file"><strong>Upload a file (PDF/TXT only):</strong></label><br>
            <input type="file" name="file" required><br>
            <button type="submit"><i class="fas fa-upload scan-icon"></i> Analyze</button>
            <div id="fileSpinner" class="spinner"></div>
        </form>

        {% if message %}
        <h3>Result:</h3>
        <p>{{ message }}</p>
        {% endif %}

        <h2><i class="fas fa-link"></i> URL Threat Detection</h2>
        <form method="post" action="/predict" onsubmit="showSpinner('urlForm', 'urlSpinner')">
            <label for="url">Enter URL:</label>
            <input type="text" name="url" required>
            <button type="submit"><i class="fas fa-search"></i> Classify</button>
            <div id="urlSpinner" class="spinner"></div>
        </form>

        {% if predicted_class %}
            <div class="result-box {{ predicted_class.lower() }}">
                <p><strong>URL:</strong> {{ input_url }}</p>
                <p><strong>Predicted Class:</strong> {{ predicted_class }}</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
